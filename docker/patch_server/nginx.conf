events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost 10.0.0.253;

        location / {
            root   /usr/share/nginx/html;
            index  index.html;
        }

        location /patches/ {
            alias  /usr/share/nginx/html/patches/;
            autoindex on;
            add_header Content-Type text/plain;
        }

        # Health check endpoint
        location /health {
            return 200 '{"status": "healthy", "service": "patch-server", "ip": "10.0.0.253"}\n';
            add_header Content-Type application/json;
        }
    }
}
