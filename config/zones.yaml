# =============================================================================
# SDN Dynamic Network Segmentation Configuration (SSOT)
# Enterprise 10-Switch 6-Zone Topology (Phase 6-C Enterprise Standard)
# =============================================================================

# 논리 망(Zone) 정의 및 기본 소속 호스트 IP 목록
zones:
  USER:
    - "10.0.0.1"   # h1 (사용자 PC 1 on S3:P1)
    - "10.0.0.2"   # h2 (사용자 PC 2 on S3:P2)
    - "10.0.0.3"   # h3 (사용자 PC 3 on S4:P1)
    - "10.0.0.4"   # h4 (사용자 PC 4 on S4:P2)
  DMZ:
    - "10.0.0.11"  # web1 (공개 Web Server on S10:P1)
    - "10.0.0.12"  # web2 (공개 WAS Server on S10:P2)
  SERVER:
    - "10.0.0.11"  # web1 (Web Server 1 on S10:P1)
    - "10.0.0.12"  # web2 (API Server 2 on S10:P2)
    - "10.0.0.21"  # h5 (내부 DB Server on S5:P1)
    - "10.0.0.22"  # h6 (내부 App Server on S6:P1)
  ADMIN:
    - "10.0.0.254" # h_admin (중앙 관제 보안관제탑 호스트 on S7:P1)
    - "10.0.0.253" # h_patch (보안 업데이트 물리 패치 서버 on S7:P2)
  QUARANTINE:
    - "10.0.0.240" # h_sink (악성 패킷 분석 싱크홀 & 프로브 on S8:P1)
    - "10.0.0.250" # h_sink (레거시 싱크홀 호환)
  EXTERNAL:
    - "192.168.100.100" # ext_h1 (외부 인터넷 침해/공격자 on S9:P1)

# 호스트 하드웨어 바인딩 (IP - MAC - Switch DPID - Port)
hosts:
  "10.0.0.1":
    mac: "00:00:00:00:00:01"
    dpid: 3
    port: 1
    zone: "USER"
  "10.0.0.2":
    mac: "00:00:00:00:00:02"
    dpid: 3
    port: 2
    zone: "USER"
  "10.0.0.3":
    mac: "00:00:00:00:00:03"
    dpid: 4
    port: 1
    zone: "USER"
  "10.0.0.4":
    mac: "00:00:00:00:00:04"
    dpid: 4
    port: 2
    zone: "USER"
  "10.0.0.11":
    mac: "00:00:00:00:00:11"
    dpid: 5
    port: 1
    zone: "DMZ"
  "10.0.0.12":
    mac: "00:00:00:00:00:12"
    dpid: 5
    port: 2
    zone: "DMZ"
  "10.0.0.21":
    mac: "00:00:00:00:00:21"
    dpid: 5
    port: 1
    zone: "SERVER"
  "10.0.0.22":
    mac: "00:00:00:00:00:22"
    dpid: 6
    port: 1
    zone: "SERVER"
  "10.0.0.254":
    mac: "00:00:00:00:00:fe"
    dpid: 7
    port: 1
    zone: "ADMIN"
  "10.0.0.253":
    mac: "00:00:00:00:00:fd"
    dpid: 7
    port: 2
    zone: "ADMIN"
  "10.0.0.240":
    mac: "00:00:00:00:00:f0"
    dpid: 8
    port: 1
    zone: "QUARANTINE"
  "10.0.0.250":
    mac: "00:00:00:00:00:fa"
    dpid: 8
    port: 1
    zone: "QUARANTINE"
  "192.168.100.100":
    mac: "00:00:00:00:00:99"
    dpid: 9
    port: 1
    zone: "EXTERNAL"

# 망간 기본 허용 규칙 (White-list Policies)
# Default-Deny 원칙: 아래 규칙에 명시되지 않은 통신은 Table 1에서 DROP
rules:
  # 1. USER -> SERVER / DMZ 업무 트래픽
  - name: "USER_TO_SERVER_WEB"
    from_zone: "USER"
    to_zone: "SERVER"
    proto: "tcp"
    dst_port: 80
    bidirectional: true  # SERVER -> USER (tcp_src 80) 자동 허용

  - name: "USER_TO_SERVER_DNS"
    from_zone: "USER"
    to_zone: "SERVER"
    proto: "udp"
    dst_port: 53
    bidirectional: true  # SERVER -> USER (udp_src 53) 자동 허용

  - name: "USER_TO_DMZ_ICMP"
    from_zone: "USER"
    to_zone: "DMZ"
    proto: "icmp"
    bidirectional: true

  # 2. USER -> SERVER 내부 업무 트래픽
  - name: "USER_TO_SERVER_DB"
    from_zone: "USER"
    to_zone: "SERVER"
    proto: "tcp"
    dst_port: 3306
    bidirectional: true

  - name: "USER_TO_SERVER_APP"
    from_zone: "USER"
    to_zone: "SERVER"
    proto: "tcp"
    dst_port: 5000
    bidirectional: true

  # 3. EXTERNAL -> DMZ 공개 서비스 트래픽 (인바운드)
  - name: "EXTERNAL_TO_DMZ_WEB"
    from_zone: "EXTERNAL"
    to_zone: "DMZ"
    proto: "tcp"
    dst_port: 80
    bidirectional: true

  # 4. QUARANTINE -> ADMIN 및 필수 인프라
  - name: "QUARANTINE_TO_ADMIN_HTTP_PATCH"
    from_zone: "QUARANTINE"
    to_zone: "ADMIN"
    proto: "tcp"
    dst_port: 80         # 격리 단말의 보안 패치 서버(10.0.0.253:80) 다운로드 전용 통로
    bidirectional: true

  - name: "QUARANTINE_TO_ADMIN_HTTPS"
    from_zone: "QUARANTINE"
    to_zone: "ADMIN"
    proto: "tcp"
    dst_port: 443
    bidirectional: true

  - name: "QUARANTINE_TO_ADMIN_DNS"
    from_zone: "QUARANTINE"
    to_zone: "ADMIN"
    proto: "udp"
    dst_port: 53
    bidirectional: true

# OS 백그라운드 멀티캐스트/브로드캐스트 Silent Drop 포트 목록
silent_drop_udp_ports:
  - 137   # NetBIOS Name Service
  - 138   # NetBIOS Datagram Service
  - 139   # NetBIOS Session Service
  - 1900  # SSDP
  - 5353  # mDNS
  - 5355  # LLMNR

# 내부 확산 전파 차단 및 ZONE_DENY 집계 대상 핵심 포트
lateral_spread_ports:
  tcp:
    - 22    # SSH
    - 135   # RPC
    - 445   # SMB
    - 3389  # RDP

# 상시 허용 (Hard Whitelist): 어떠한 경우에도 차단/격리 불가
hard_whitelist:
  probe_ip: "10.0.0.240"
  protected_ips:
    - "10.0.0.11"
    - "10.0.0.12"
    - "10.0.0.21"
    - "10.0.0.22"
    - "10.0.0.253"
    - "10.0.0.254"
