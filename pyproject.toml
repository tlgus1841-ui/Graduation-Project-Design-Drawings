[project]
name = "self-defending-sdn-tower"
version = "0.1.0"
description = "Self-Defending SDN Tower: AI-driven SDN Traffic Anomaly Detection & Autonomous Defense"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.109.2",
    "joblib==1.3.2",
    "networkx==2.5.1",
    "numpy==1.24.3",
    "pydantic==2.6.1",
    "redis==5.0.1",
    "scapy==2.5.0",
    "scikit-learn==1.3.2",
    "uvicorn[standard]==0.27.1",
    "websockets==12.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "flake8>=7.4.1",
    "mypy>=2.3.1",
    "httpx>=0.26.0,<0.28",
    "fakeredis>=2.20",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
