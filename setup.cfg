[flake8]
# rules/04_quality_testing.md documents `--max-line-length=120 --exclude=.venv,ui` as the
# project's flake8 convention, but it was never written to a config file, so a fresh
# checkout with no local flake8 args falls back to the 79-char default and fails on
# hundreds of lines. This file makes the documented convention the actual default.
max-line-length = 120
exclude = .git,__pycache__,.venv,.mypy_cache,.pytest_cache,ui/node_modules,ui/dist
